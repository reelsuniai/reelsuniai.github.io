<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<title>This entire reel was made by Claude Code</title>
<link rel="stylesheet" href="assets/fonts.css" />
<script src="assets/gsap.min.js"></script><script src="words.js"></script><script src="reel.js"></script><script src="fx.js"></script><script src="mascot_rig.js"></script><script src="scenes.js"></script><script src="engine.js"></script>
<style>html,body{margin:0;padding:0;background:#F2F0EE} #root{position:relative;width:1080px;height:1920px;overflow:hidden} #cv{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="18.128" data-width="1080" data-height="1920">
  <canvas id="cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
  <audio id="mix" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="18.128" data-track-index="10" data-volume="1"></audio>
</div>
<script>
(async () => {
  await FILM.load();
  const ctx = document.getElementById('cv').getContext('2d');
  const clock = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: FILM.DUR, duration: FILM.DUR, ease: 'none', onUpdate: () => FILM.render(ctx, clock.t) }, 0);
  FILM.render(ctx, 0);
  window.__timelines = window.__timelines || {}; window.__timelines['main'] = tl;
})();
</script></body></html>
