/* Layout: a flat-lay on a blue cutting mat. Sticker-label title collage at the
   top, paper link cards down the middle, small desk props only at the edges. */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }

body {
  margin: 0;
  min-height: 100svh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--grid) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px),
    radial-gradient(70% 45% at 25% 8%, rgba(255,255,255,.12), transparent 70%),
    radial-gradient(60% 50% at 85% 95%, rgba(5,20,80,.35), transparent 70%),
    linear-gradient(180deg, var(--mat), var(--mat-deep));
  background-size: 46px 46px, 46px 46px, 100% 100%, 100% 100%, 100% 100%;
  background-position: -1px -1px, -1px -1px, 0 0, 0 0, 0 0;
}
/* faint mat texture */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  opacity: .07;
  mix-blend-mode: overlay;

}

.stage { position: relative; overflow: hidden; min-height: 100svh; }

/* ══ Desk props (decorative, edges only) ══════════════════════════════════ */
.props { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.prop {
  position: absolute;
  transform: rotate(var(--r, 0deg));
  filter: drop-shadow(0 6px 8px rgba(0,15,60,.35));
}
.prop svg { display: block; width: 100%; height: auto; }

/* pill stickers for tools */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px 7px 8px;
  border-radius: 999px;
  border: 3px solid #fff;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  background: #fff;
  color: #141414;
}
.pill svg { width: 20px; height: 20px; flex: 0 0 auto; }
.pill--dark { background: #111; color: #fff; }

.toggle {
  width: 70px; height: 38px;
  border-radius: 999px;
  background: #e9edf5;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.18);
  position: relative;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 4px; left: 4px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.25);
  animation: flip 6s cubic-bezier(.5,0,.2,1) infinite;
}
@keyframes flip { 0%, 40% { transform: none; } 50%, 90% { transform: translateX(32px); } 100% { transform: none; } }

.polaroid {
  width: 104px;
  padding: 7px 7px 26px;
  background: #fbfaf6;
  border-radius: 3px;
}
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; }
.polaroid span {
  position: absolute; left: 0; right: 0; bottom: 6px;
  text-align: center; font: 600 10px/1 var(--font-display); color: #333;
}

.twinkle { animation: twinkle 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes twinkle { 0%, 100% { transform: rotate(var(--r,0deg)) scale(.7); opacity: .6; } 50% { transform: rotate(var(--r,0deg)) scale(1.1); opacity: 1; } }

/* ══ Page ═════════════════════════════════════════════════════════════════ */
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding-block: clamp(70px, 12vh, 104px) calc(170px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}

/* ── Title collage ────────────────────────────────────────────────────── */
.collage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 46px;
}

.handle {
  align-self: flex-start;
  margin: 0 0 -4px 18px;
  padding: 4px 10px;
  background: var(--yellow);
  color: var(--ink);
  font: 700 15px/1.2 var(--font-display);
  text-decoration: none;
  position: relative;
  z-index: 3;
  transform: rotate(-2deg);
  box-shadow: 0 4px 8px rgba(0,15,60,.3);
}
.handle:focus-visible { outline: 2px dashed #fff; outline-offset: 4px; }
/* make the yellow tag a full 44px tap target without changing how it looks */
.handle::after { content: ""; position: absolute; inset: -10px -6px; }

.label {
  position: relative;
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1;
  box-shadow: 0 10px 18px -6px rgba(0,15,60,.5);
}
.label--red {
  z-index: 2;
  padding: 10px 22px 14px 18px;
  font-size: clamp(56px, 18vw, 80px);
  color: #fff;
  background: var(--red);
  transform: rotate(-4deg) translateX(-10px);
}
.label--white {
  z-index: 1;
  margin-top: -8px;
  padding: 10px 18px 13px;
  font-size: clamp(38px, 12.2vw, 54px);
  color: var(--ink);
  background: var(--paper);
  transform: rotate(2deg) translateX(14px);
}
.label--tag {
  z-index: 3;
  margin-top: -6px;
  align-self: flex-end;
  margin-right: 6px;
  padding: 5px 11px 7px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--ink);
  background: var(--yellow);
  transform: rotate(-7deg);
}

.avatar-sticker {
  position: absolute;
  z-index: 4;
  top: -34px;
  right: 6px;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: #fff;
  transform: rotate(10deg);
  box-shadow: 0 8px 16px rgba(0,15,60,.4);
}
.avatar-sticker img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover; }

/* the dashed "selection box" from design apps */
.select {
  position: absolute;
  z-index: 3;
  width: 120px;
  height: 46px;
  left: 50%;
  top: 37%;
  margin-left: -4px;
  border: 1.5px dashed rgba(255,255,255,.9);
  pointer-events: none;
}
.select::before, .select::after {
  content: "";
  position: absolute;
  width: 7px; height: 7px;
  background: #fff;
  border: 1px solid var(--ink);
}
.select::before { left: -4px; top: -4px; }
.select::after  { right: -4px; bottom: -4px; }

.cursor {
  position: absolute;
  z-index: 5;
  width: 34px;
  right: 2px;
  bottom: -26px;
  filter: drop-shadow(0 4px 4px rgba(0,15,60,.35));
  animation: point 3.2s ease-in-out infinite;
}
@keyframes point { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-6px,-6px); } }

.spark {
  position: absolute;
  z-index: 4;
  width: 22px;
  color: var(--yellow);
}

.captions {
  margin: 22px 0 0;
  text-align: center;
  font: 700 18px/1.15 var(--font-display);
  letter-spacing: -.02em;
  color: var(--on-mat);
  transform: rotate(-3deg);
  text-shadow: 0 2px 6px rgba(0,15,60,.35);
}
.captions span { display: block; }
.captions span + span { transform: translateX(18px); }

/* ── Section label ───────────────────────────────────────────────────── */
.section {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 18px 4px;
  font: 700 17px/1 var(--font-display);
  color: var(--on-mat);
}
.section b {
  padding: 4px 8px;
  font-size: 12px;
  color: var(--ink);
  background: var(--yellow);
  transform: rotate(-3deg);
}

/* ── Link cards: paper on the mat ─────────────────────────────────────── */
.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.links > li { --tilt: -0.8deg; }
.links > li:nth-child(even) { --tilt: 0.9deg; }
.links > li:nth-child(3n) { --tilt: -0.4deg; }

.tile {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 92px;
  padding: 16px 16px 16px 14px;
  border-radius: var(--btn-radius);
  text-decoration: none;
  color: var(--ink);
  background: var(--paper);
  transform: rotate(var(--tilt));
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 12px 20px -8px rgba(0,15,60,.55);
  outline: 2px dashed transparent;
  outline-offset: 6px;
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), outline-color .2s ease, box-shadow .3s ease;
  -webkit-tap-highlight-color: transparent;
}
.tile:hover, .tile:focus-visible {
  transform: rotate(0deg) translateY(-3px);
  outline-color: rgba(255,255,255,.95);
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 20px 26px -10px rgba(0,15,60,.6);
}
.tile:active { transform: rotate(0deg) scale(.97); transition-duration: .12s; }

.tile__icon {
  flex: 0 0 auto;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: var(--ink);
  border: 3px solid #fff;
  box-shadow: 0 0 0 1px rgba(11,27,77,.12), 0 4px 8px rgba(0,15,60,.25);
  transform: rotate(-5deg);
}
.tile__icon svg { width: 25px; height: 25px; }

.tile__text { flex: 1 1 auto; min-width: 0; }
.tile__label {
  display: block;
  font: 800 19px/1.1 var(--font-display);
  letter-spacing: -.03em;
}
.tile__desc {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--muted);
}
.tile__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  font: 600 12px/1 var(--font-display);
  color: var(--muted);

}
.tile__stars {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  color: var(--ink);
  background: var(--yellow);
}
.tile__stars svg { width: 11px; height: 11px; }

.tile__go {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--ink);
  background: var(--yellow);
  transition: transform .45s cubic-bezier(.34,1.56,.64,1);
}
.tile__go svg { width: 16px; height: 16px; }
.tile:hover .tile__go { transform: rotate(-12deg) scale(1.08); }

/* Featured: red card with a strip of tape */
.tile--featured { color: #fff; background: var(--red); }
.tile--featured .tile__desc, .tile--featured .tile__meta { color: rgba(255,255,255,.88); }
.tile--featured .tile__icon { color: var(--red); background: #fff; border-color: #fff; }
.tile--featured::before {           /* tape */
  content: "";
  position: absolute;
  top: -11px;
  left: 50%;
  width: 84px;
  height: 22px;
  margin-left: -42px;
  background: rgba(255,255,255,.62);
  transform: rotate(-3deg);
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.tile__badge {
  position: absolute;
  top: -12px;
  right: 14px;
  padding: 4px 9px;
  font: 700 11px/1.2 var(--font-display);
  letter-spacing: .02em;
  color: var(--ink);
  background: var(--yellow);
  transform: rotate(4deg);
  box-shadow: 0 3px 6px rgba(0,15,60,.3);
}

/* ── Footer ───────────────────────────────────────────────────────────── */
.footer { margin-top: 40px; text-align: center; color: var(--on-mat); }
.footer p { margin: 0; }
.footer__brand { font: 700 15px/1.2 var(--font-display); transform: rotate(-2deg); }
.footer__brand a { color: inherit; text-decoration: none; display: inline-block; padding: 12px 6px; }
.footer__brand a:focus-visible { outline: 2px dashed #fff; outline-offset: 2px; }
.footer__note { font-size: 11.5px; opacity: .75; }

.noscript { padding: 16px; background: var(--paper); text-align: center; font-size: 14px; }

/* ── Motion: stickers slap down onto the mat ─────────────────────────── */
@keyframes slap {
  0%   { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.35) translateY(-10px); }
  60%  { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.96); }
  100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); }
}
@keyframes drop {
  0%   { opacity: 0; transform: translateY(24px) rotate(calc(var(--tilt, 0deg) * 4)); }
  100% { opacity: 1; transform: none; }
}
.in { animation: slap .7s cubic-bezier(.3,1.4,.5,1) backwards; animation-delay: var(--d, 0ms); }
.label--red   { --r: -4deg; }
.label--white { --r: 2deg; }
.label--tag   { --r: -7deg; }
.handle       { --r: -2deg; }
.avatar-sticker { --r: 10deg; }

.links > li { animation: drop .7s cubic-bezier(.2,.9,.3,1.15) backwards; animation-delay: var(--d, 0ms); }
.fade { animation: fadeIn .8s ease backwards; animation-delay: var(--d, 0ms); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

html.no-intro .in, html.no-intro .links > li, html.no-intro .fade { animation: none; }

@media (prefers-reduced-motion: reduce) {

  };
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const outbound = a => { a.target = "_blank"; a.rel = "noopener noreferrer"; return a; };
  const delay = (n, ms) => { n.style.setProperty("--d", ms + "ms"); return n; };

  function setMeta(attr, key, value) {
    let tag = document.head.querySelector('meta[' + attr + '="' + key + '"]');
    if (!tag) { tag = document.createElement("meta"); tag.setAttribute(attr, key); document.head.appendChild(tag); }
    tag.setAttribute("content", value);
  }
  function renderMeta() {
    const m = CONFIG.meta || {};
    if (m.title) { setMeta("property", "og:title", m.title); setMeta("name", "twitter:title", m.title); }
    if (m.description) {
      setMeta("name", "description", m.description);
      setMeta("property", "og:description", m.description);
      setMeta("name", "twitter:description", m.description);
    }
    if (m.image) { setMeta("property", "og:image", m.image); setMeta("name", "twitter:image", m.image); }
    if (m.url && m.url.indexOf("http") === 0) setMeta("property", "og:url", m.url);
  }

  function renderHeader() {
    const host = document.getElementById("header");

    if (CONFIG.handle) {
      const a = outbound(el("a", "handle in"));
      a.href = href(CONFIG.handleUrl);
      a.textContent = CONFIG.handle;
      a.setAttribute("aria-label", "Instagram " + CONFIG.handle);
      host.appendChild(delay(a, 420));
    }

    const h1 = el("h1", "");
    h1.style.cssText = "margin:0;display:flex;flex-direction:column;align-items:center;";
    h1.setAttribute("aria-label", CONFIG.name);
    const w1 = el("span", "label label--red in"); w1.textContent = CONFIG.word1; w1.setAttribute("aria-hidden", "true");
    const w2 = el("span", "label label--white in"); w2.textContent = CONFIG.word2; w2.setAttribute("aria-hidden", "true");
    h1.appendChild(delay(w1, 60));
    h1.appendChild(delay(w2, 200));
    host.appendChild(h1);

    if (CONFIG.tag) {
      const t = el("span", "label label--tag in"); t.textContent = CONFIG.tag;
      host.appendChild(delay(t, 340));
    }

    if (CONFIG.avatar) {
      const s = el("div", "avatar-sticker in");
      const img = el("img");
      img.src = CONFIG.avatar; img.alt = CONFIG.avatarAlt || CONFIG.name;
      img.width = 74; img.height = 74; img.decoding = "async"; img.loading = "lazy";
      s.appendChild(img);
      host.appendChild(delay(s, 500));
      const pol = document.querySelector("#polaroid img");
      if (pol) pol.src = CONFIG.avatar;
    }

    const sel = el("span", "select fade"); sel.setAttribute("aria-hidden", "true");
    host.appendChild(delay(sel, 900));
    const cur = el("span", "cursor", ICONS.cursor); cur.setAttribute("aria-hidden", "true");
    host.appendChild(cur);
    [["8%", "52%", "-1s"], ["86%", "8%", "-2s"]].forEach(function (p) {
      const sp = el("span", "spark twinkle", ICONS.spark); sp.setAttribute("aria-hidden", "true");
      sp.style.left = p[0]; sp.style.top = p[1]; sp.style.setProperty("--d", p[2]);
      host.appendChild(sp);
    });

    if (CONFIG.captions && CONFIG.captions.length) {
      const c = el("p", "captions fade");
      CONFIG.captions.forEach(line => { const s = el("span"); s.textContent = line; c.appendChild(s); });
      host.appendChild(delay(c, 520));
    }
  }

  function renderLinks() {
    const links = CONFIG.links || [];
    document.getElementById("section-label").innerHTML =
      '<span>' + esc(CONFIG.sectionLabel || "links") + ' ↓</span><b>' + links.length + ' tools</b>';

    const host = document.getElementById("links");
    links.forEach(function (link, i) {
      const li = delay(el("li"), 640 + i * 90);
      const a = el("a", "tile" + (link.featured ? " tile--featured" : ""));
      if (link.download) {
        a.href = link.url;
        a.setAttribute("download", link.download);
      } else {
        outbound(a);
        a.href = href(link.url);
      }
      a.setAttribute("aria-label", link.label + (link.desc ? ". " + link.desc : "") +
        (link.download ? " (downloads a ZIP file)" : " (opens GitHub)"));
      a.innerHTML =
        (link.badge ? '<span class="tile__badge" aria-hidden="true">' + esc(link.badge) + '</span>' : '') +
        '<span class="tile__icon" aria-hidden="true">' + (ICONS[link.icon] || ICONS.github) + '</span>' +
        '<span class="tile__text">' +
          '<span class="tile__label">' + esc(link.label) + '</span>' +
          (link.desc ? '<span class="tile__desc">' + esc(link.desc) + '</span>' : '') +
          ((link.owner || link.stars) ? '<span class="tile__meta">' +
            (link.owner ? '<span>' + esc(link.owner) + '</span>' : '') +
            (link.stars ? '<span class="tile__stars">' + ICONS.star + esc(link.stars) + '</span>' : '') +
          '</span>' : '') +
        '</span>' +
        '<span class="tile__go" aria-hidden="true">' + (link.download ? ICONS.download : ICONS.arrow) + '</span>';
      li.appendChild(a);
      host.appendChild(li);
    });
  }

  /* Sends a one-pixel "+1" to your private GoatCounter. No script is loaded
     from anywhere else and nothing is stored on the visitor's phone. */
  function setupCounter() {
    const code = CONFIG.goatcounter;
    if (!code || location.protocol !== "https:") return;      // skip local previews
    const base = "https://" + code + ".goatcounter.com/count";
    const ping = q => {
      try {
        const img = new Image();
        img.src = base + "?" + q + "&rnd=" + Math.random().toString(36).slice(2);
      } catch (e) { /* stats are optional */ }
    };
    const enc = encodeURIComponent;
    ping("p=" + enc(location.pathname || "/") +
         "&t=" + enc(document.title) +
         "&r=" + enc(document.referrer || "") +
         "&s=" + enc(screen.width + "," + screen.height + "," + (window.devicePixelRatio || 1)));
    document.getElementById("links").addEventListener("click", function (e) {
      const a = e.target.closest("a.tile");
      if (!a) return;
      const label = a.querySelector(".tile__label");
      ping("p=" + enc("click: " + (label ? label.textContent : a.href)) + "&e=true&t=" + enc(a.href));
    });
  }

  function renderFooter() {
    const host = document.getElementById("footer");
    const p = el("p", "footer__brand");
    const a = outbound(el("a")); a.href = href(CONFIG.handleUrl); a.textContent = CONFIG.footer;
    p.appendChild(a);
    host.appendChild(p);
    const n = el("p", "footer__note");
    n.textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + (CONFIG.footnote ? " · " + CONFIG.footnote : "");
    host.appendChild(n);
  }

  renderMeta();
  renderHeader();
  renderLinks();
  renderFooter();
  setupCounter();
})();
</script>
</body>
</html>
