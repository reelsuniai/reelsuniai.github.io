     ─────────────────────────────────────────────────────────────────────── */

    { platform: "instagram", url: "" },
    { platform: "youtube",   url: "" },
    { platform: "email",     url: "" }
  ],

  /* ── Behaviour ──────────────────────────────────────────────────────── */
  utmSource: "bio",    // appended to every outbound link as ?utm_source=…

  motion: {
    intro: true,       // staggered rise as the page loads
    float: false       // link cards drift gently, forever

  /* ── Theme tokens ───────────────────────────────────────────────────────

    light: {
      "--bg":           "#f4f4f5",
      "--fg":           "#18181b",
      "--muted":        "rgba(24,24,27,0.62)",
      "--btn-bg":       "#ffffff",
      "--btn-fg":       "#18181b",
      "--btn-border":   "#18181b",
      "--btn-radius":   "14px",
      "--accent":       "#2563eb",
      "--ring":         "#2563eb",

      "--bg":           "#0c0c0e",
      "--fg":           "#f4f4f5",
      "--muted":        "rgba(244,244,245,0.60)",
      "--btn-bg":       "#1a1a1f",
      "--btn-fg":       "#f4f4f5",
      "--btn-border":   "#3f3f46",
      "--btn-radius":   "14px",
      "--accent":       "#60a5fa",
      "--ring":         "#60a5fa",
      "--shadow":       "4px 5px 0 #000000",
      "--font-display": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
      "--font-body":    "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    }
  },

  /* ── Links, in display order ────────────────────────────────────────────
     { label, url }                      → standard button
     + sub:      "small line under the label"
     + icon:     cloud | bag | play | device | link   (see ICONS below)
     + featured: true                    → highlighted, for the priority link
     + type: "video" + thumb, thumbAlt   → wide tile with a preview image
     ─────────────────────────────────────────────────────────────────────── */
  links: [
    {
      featured: true,
      label: "Start here",
      sub:   "The thing you most want clicked",
      icon:  "link",
      url:   "https://example.com"
    },
    {
      label: "Second link",
      icon:  "bag",
      url:   "https://example.com"
    }
  ]

/* Paint theme tokens and motion switches before first render so there is no flash. */
(function () {
  const decl = o => Object.entries(o).map(([k, v]) => k + ":" + v).join(";");
  const s = document.createElement("style");
  s.textContent =
    ":root{" + decl(CONFIG.theme.light) + "}" +
    (CONFIG.theme.dark
      ? "@media (prefers-color-scheme: dark){:root{" + decl(CONFIG.theme.dark) + "}}"
      : "");
  document.head.appendChild(s);

  const m = CONFIG.motion || {};
  if (m.intro === false) document.documentElement.classList.add("no-intro");
  if (m.float !== true)  document.documentElement.classList.add("no-float");
})();
</script>


<style>
/* ═══════════════════════════════════════════════════════════════════════════
   The styling below is a plain, solid starting point — deliberately not a look.
   Replace it with whatever the reference calls for. The structure, the tokens
   and the renderer are what you want to keep.
   ═══════════════════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.page {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: clamp(40px, 12vh, 88px) 22px calc(52px + env(safe-area-inset-bottom));
}

/* ── Header ───────────────────────────────────────────────────────────── */
.header { text-align: center; margin-bottom: 40px; }

.avatar-wrap { width: 92px; height: 92px; margin: 0 auto 18px; }
.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 2px solid var(--btn-border);
  background: var(--btn-bg);
}

.name {
  font-family: var(--font-display);
  font-size: 27px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: -.02em;
  margin: 0 0 8px;
}
.name a { color: inherit; text-decoration: none; }
.name a:hover { text-decoration: underline; }

.bio {
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
  color: var(--muted);
  max-width: 30ch;
  margin-inline: auto;
}

/* ── Social row ───────────────────────────────────────────────────────── */
.socials {
  list-style: none;
  margin: 20px 0 0;
  padding: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}
.social {
  display: grid;
  place-items: center;
  width: 44px;                     /* exactly the 44px tap-target floor */
  height: 44px;
  border-radius: 50%;
  color: var(--btn-fg);
  text-decoration: none;
  background: var(--btn-bg);
  border: 2px solid var(--btn-border);
  transition: transform .2s cubic-bezier(.2,.8,.3,1);
}
.social svg { width: 19px; height: 19px; display: block; }
a.social:hover, .social--pending:hover { transform: translateY(-2px); }
a.social:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }

/* Two kinds of url-less icon.
   --empty  : visibly unfilled, so the slot is obvious while editing.
   --pending: styled exactly like a live one. It is a <span>, not an <a>, and is
              hidden from assistive tech — announcing a link that goes nowhere is
              worse than not announcing it at all. */
.social--empty { opacity: .35; cursor: default; }
.social--pending { cursor: pointer; }

/* ── Link stack ───────────────────────────────────────────────────────── */
.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.tile {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 64px;                /* comfortably past the 44px tap floor */
  padding: 14px 18px;
  border-radius: var(--btn-radius);
  text-decoration: none;
  color: var(--btn-fg);
  background: var(--btn-bg);
  border: 2px solid var(--btn-border);
  box-shadow: var(--shadow);
  transition: transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s ease;
}
.tile:hover  { transform: translate(-2px, -3px); box-shadow: 6px 8px 0 var(--btn-border); }
.tile:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--btn-border); }
.tile:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }

.tile--featured { border-color: var(--accent); }
.tile--featured .tile__icon { color: var(--accent); border-color: var(--accent); }

.tile__icon {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
}
.tile__icon svg { width: 18px; height: 18px; display: block; }

.tile__text  { flex: 1 1 auto; min-width: 0; }
.tile__label {
  display: block;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
}
.tile__sub {
  display: block;
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--muted);
}
.tile__chev { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); }
.tile__chev svg { width: 100%; height: 100%; display: block; }

/* ── Media tile (video / image preview) ───────────────────────────────── */
.tile--media { display: block; padding: 12px 12px 16px; }
.media {
  position: relative;
  display: block;
  border-radius: calc(var(--btn-radius) - 4px);
  overflow: hidden;
  border: 2px solid var(--btn-border);
}
.media img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}
.media__play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--btn-fg);
  background: var(--btn-bg);
  border: 2px solid var(--btn-border);
}
.media__play svg { width: 20px; height: 20px; margin-left: 3px; display: block; }
.media__meta { display: flex; align-items: center; gap: 14px; padding: 14px 6px 0; }

/* ── Footer ───────────────────────────────────────────────────────────── */
.footer {
  margin-top: 40px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

.noscript {
  padding: 16px;
  border-radius: var(--btn-radius);
  border: 2px solid var(--btn-border);
  background: var(--btn-bg);
  text-align: center;
  font-size: 14px;
}

/* ── Motion ───────────────────────────────────────────────────────────── */
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}

.name    { animation: rise .7s cubic-bezier(.2,.8,.3,1) backwards; }
.avatar-wrap { animation: rise .7s cubic-bezier(.2,.8,.3,1) 60ms backwards; }
.bio     { animation: rise .7s cubic-bezier(.2,.8,.3,1) 140ms backwards; }
.socials { animation: rise .7s cubic-bezier(.2,.8,.3,1) 210ms backwards; }
.footer  { animation: rise .7s cubic-bezier(.2,.8,.3,1) 600ms backwards; }
.tile    { animation: rise .7s cubic-bezier(.2,.8,.3,1) backwards;
           animation-delay: var(--intro-delay, 0ms); }   /* set per-item in JS */

/* Optional drift. Amplitude stays under half the stack gap so neighbours never
   touch, and every card gets a negative delay so they are already out of phase
   on the first frame rather than bobbing in unison. */
.links > li {
  animation: drift var(--f-dur, 12s) ease-in-out infinite;
  animation-delay: var(--f-delay, 0s);
}
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
  25%  { transform: translate3d(calc(var(--fx, 4) * 1px),  calc(var(--fy, 5) * -1px),   0) rotate(calc(var(--fr, .4) * 1deg)); }
  50%  { transform: translate3d(calc(var(--fx, 4) * .3px), calc(var(--fy, 5) * -.25px), 0) rotate(0deg); }
  75%  { transform: translate3d(calc(var(--fx, 4) * -1px), calc(var(--fy, 5) * 1px),    0) rotate(calc(var(--fr, .4) * -1deg)); }
  100% { transform: translate3d(0, 0, 0) rotate(0deg); }
}

html.no-intro .name,
html.no-intro .avatar-wrap,
html.no-intro .bio,
html.no-intro .socials,
html.no-intro .footer,
html.no-intro .tile { animation: none; }
html.no-float .links > li { animation: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition-duration: .001ms !important;
  }
  .tile:hover { transform: none; }
}
</style>

      const meta = SOCIALS[s.platform];
      const li = el("li");
      let node;

      if (s.url) {
        node = el("a", "social", meta.svg);
        node.href = withUtm(s.url);
        node.setAttribute("aria-label", s.label || meta.label);
        if (node.protocol === "http:" || node.protocol === "https:") {
          node.target = "_blank";
          node.rel = "noopener noreferrer";
        }
      } else {
        node = el("span", "social social--" + (s.placeholder ? "pending" : "empty"), meta.svg);
        node.title = s.placeholder
          ? (s.label || meta.label)
          : (s.label || meta.label) + " — add a url in CONFIG.socials";
        node.setAttribute("aria-hidden", "true");
      }

      li.appendChild(node);
      ul.appendChild(li);
    });

    host.appendChild(ul);
  }

  /* ── Links ───────────────────────────────────────────────────────────── */
  function renderLinks() {
    const host = document.getElementById("links");
    const frag = document.createDocumentFragment();
    const rnd = (lo, hi) => lo + Math.random() * (hi - lo);

    (CONFIG.links || []).forEach(function (link, i) {
      const li = el("li");

      // Drift, randomised per card, with a negative delay so no two are in phase.
      li.style.setProperty("--fx",      rnd(3, 6).toFixed(2));
      li.style.setProperty("--fy",      rnd(3, 5).toFixed(2));
      li.style.setProperty("--fr",      rnd(0.2, 0.5).toFixed(2));
      li.style.setProperty("--f-dur",   rnd(10, 16).toFixed(1) + "s");
      li.style.setProperty("--f-delay", "-" + rnd(0, 14).toFixed(1) + "s");

      const a = el("a", "tile" +
        (link.type === "video" ? " tile--media" : "") +
        (link.featured ? " tile--featured" : ""));
      a.href = withUtm(link.url);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.setProperty("--intro-delay", (280 + i * 80) + "ms");
      a.innerHTML = link.type === "video" ? videoTile(link) : standardTile(link);

      li.appendChild(a);
      frag.appendChild(li);
    });

    host.appendChild(frag);
  }

  function standardTile(link) {
    return '' +
      '<span class="tile__icon" aria-hidden="true">' + (ICONS[link.icon] || ICONS.link) + '</span>' +
      '<span class="tile__text">' +
        '<span class="tile__label">' + esc(link.label) + '</span>' +
        (link.sub ? '<span class="tile__sub">' + esc(link.sub) + '</span>' : '') +
      '</span>' +
      '<span class="tile__chev">' + ICONS.chev + '</span>';
  }

  function videoTile(link) {
    return '' +
      '<span class="media">' +
        '<img src="' + esc(link.thumb) + '" alt="' + esc(link.thumbAlt || link.label) + '" ' +
             'loading="lazy" decoding="async" width="440" height="248">' +
        '<span class="media__play" aria-hidden="true">' + ICONS.play + '</span>' +
      '</span>' +
      '<span class="media__meta">' +
        '<span class="tile__text">' +
          '<span class="tile__label">' + esc(link.label) + '</span>' +
          (link.sub ? '<span class="tile__sub">' + esc(link.sub) + '</span>' : '') +
        '</span>' +
        '<span class="tile__chev">' + ICONS.chev + '</span>' +
      '</span>';
  }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  function renderFooter() {
    const host = document.getElementById("footer");
    const p = el("p");
    p.style.margin = "0";
    p.textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
    host.appendChild(p);
  }

  renderMeta();
  renderHeader();
  renderLinks();
  renderFooter();
})();
</script>
